<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas注文入力</title>
  <style>
    :root { color-scheme: dark; background: #0f1115; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f1115; }
    body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; width: min(100vw, 920px); height: min(100vh, 600px); outline: none; }
  </style>
</head>
<body>
  <canvas id="order-entry" width="920" height="600" tabindex="0" aria-label="Canvas注文入力"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById("order-entry");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const c = { bg: "#0f1115", panel: "#1a1d24", panel2: "#20242c", line: "#303641", text: "#eef1f4", muted: "#8e98a8", teal: "#4ade80", orange: "#f0a35a" };
      let stage = "ready";
      let input = "";
      let order = null;
      let status = "データを待っています";

      function rect(x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
      }
      function text(value, x, y, size, color = c.text, weight = 400, align = "left") {
        ctx.fillStyle = color;
        ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(value, x, y);
      }
      function button(label, x, y, w, color, enabled = true) {
        rect(x, y, w, 54, 5, enabled ? color : c.panel2, enabled ? color : c.line);
        text(label, x + w / 2, y + 28, 15, enabled ? "#101318" : c.muted, 700, "center");
      }
      function drawSteps() {
        const labels = ["1  受け取り", "2  確認", "3  完了"];
        labels.forEach((label, index) => {
          const active = (stage === "ready" && index === 0) || (stage === "input" && index === 0) || (stage === "loaded" && index === 1) || (stage === "complete" && index === 2);
          text(label, 116 + index * 235, 92, 12, active ? c.teal : c.muted, active ? 700 : 500);
          if (index < 2) text("/", 319 + index * 235, 92, 12, c.line, 700, "center");
        });
      }
      function draw() {
        ctx.fillStyle = c.bg;
        ctx.fillRect(0, 0, W, H);
        text("Canvas注文入力", 72, 52, 24, c.text, 700);
        text("GUI操作対象", 848, 52, 12, c.muted, 600, "right");
        drawSteps();
        ctx.fillStyle = c.line;
        ctx.fillRect(72, 116, 776, 1);

        text(stage === "ready" ? "注文データを取り込む" : stage === "input" ? "注文データを入力" : stage === "loaded" ? "注文内容を確認" : "注文処理が完了", 72, 160, 30, c.text, 650);
        text(status, 72, 194, 14, c.muted);

        rect(72, 232, 776, 148, 6, c.panel, c.line);
        if (stage === "ready") {
          text("注文データがありません", 104, 280, 20, c.muted, 600);
          text("下のボタンをクリックして入力欄を有効にします。", 104, 316, 14, c.muted);
        } else if (stage === "input") {
          text("受信データ", 104, 267, 11, c.muted, 700);
          const shown = input.length > 82 ? input.slice(0, 82) + "..." : input;
          text(shown || "ここに入力...", 104, 306, 14, input ? c.text : c.muted, 500);
          text("Enterキーで続行", 104, 346, 11, c.teal, 700);
        } else {
          text("注文 " + order.id, 104, 266, 12, c.teal, 700);
          text(`${order.customer}  /  ${order.item}`, 104, 302, 19, c.text, 600);
          text(`数量 ${order.quantity}  /  合計 ¥${order.total}`, 104, 340, 14, c.muted, 500);
        }

        if (stage === "ready") button("注文データを取り込む", 72, 432, 260, c.teal);
        if (stage === "input") button("入力中...", 72, 432, 260, c.panel2, false);
        if (stage === "loaded") button("在庫更新を送信", 72, 432, 260, c.orange);
        if (stage === "complete") button("在庫更新完了", 72, 432, 260, c.teal);
        text("Canvasのみ  ·  DOM操作なし", 72, 552, 12, c.muted);
        requestAnimationFrame(draw);
      }
      function parseInput() {
        const values = {};
        input.split(";").forEach((part) => {
          const separator = part.indexOf("=");
          if (separator > 0) values[part.slice(0, separator)] = part.slice(separator + 1);
        });
        order = { id: values.ORDER_ID || "RLY-2048", customer: values.CUSTOMER || "Unknown", item: values.ITEM || "Unknown item", quantity: values.QUANTITY || "0", total: values.TOTAL || "0" };
        stage = "loaded";
        status = "キー入力でデータを受け取りました";
      }
      canvas.addEventListener("click", (event) => {
        const bounds = canvas.getBoundingClientRect();
        const x = (event.clientX - bounds.left) * W / bounds.width;
        const y = (event.clientY - bounds.top) * H / bounds.height;
        canvas.focus();
        if (stage === "ready" && x >= 72 && x <= 332 && y >= 432 && y <= 486) {
          stage = "input";
          input = "";
          status = "入力欄を有効にしました";
        } else if (stage === "loaded" && x >= 72 && x <= 372 && y >= 432 && y <= 486) {
          stage = "complete";
          status = "在庫更新を受け付けました";
        }
      });
      canvas.addEventListener("keydown", (event) => {
        if (stage !== "input") return;
        if (event.key === "Enter") { event.preventDefault(); parseInput(); return; }
        if (event.key === "Backspace") { input = input.slice(0, -1); return; }
        if (event.key.length === 1) { input += event.key; event.preventDefault(); }
      });
      canvas.focus();
      draw();
    })();
  </script>
</body>
</html>
