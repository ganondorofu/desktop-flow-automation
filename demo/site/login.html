<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>デモ ログイン</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 12px; padding: 32px 40px; width: 300px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .hint { font-size: 12px; color: #5b6478; margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: #8891a5; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; background: #0f1115; border: 1px solid #2a2e38; border-radius: 6px; color: #eee; padding: 8px 10px; font-size: 14px; }
  button { margin-top: 20px; width: 100%; background: #4ade80; color: #0f1115; border: none; border-radius: 6px; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #login-error { margin-top: 12px; color: #f87171; font-size: 13px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>発注システム ログイン</h1>
    <div class="hint">デモ用アカウント: demo / demo1234</div>
    <label for="username">ユーザー名</label>
    <input id="username" type="text" autocomplete="off" />
    <label for="password">パスワード</label>
    <input id="password" type="password" autocomplete="off" />
    <button id="login-btn" type="button">ログイン</button>
    <div id="login-error">ユーザー名またはパスワードが違います</div>
  </div>
  <script>
    document.getElementById("login-btn").addEventListener("click", () => {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "demo" && pass === "demo1234") {
        window.location.href = "order.html";
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    });
  </script>
</body>
</html>
